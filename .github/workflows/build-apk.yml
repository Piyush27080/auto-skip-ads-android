name: Build Android APK

# Runs on every push to main, and you can also start it by hand:
# GitHub repository -> Actions -> "Build Android APK" -> Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04      # fixed version, so the build does not change when ubuntu-latest moves to a new Ubuntu

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Prepare the Android SDK (make it writable, accept licenses)
        # Uses the runner's own Java 17 for sdkmanager, because sdkmanager can fail on very new Java versions
        run: |
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          yes | JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"        # matches this project (gradle/gradle-daemon-jvm.properties asks for Java 25)

      - name: Set up Gradle (with cache, so later builds are faster)
        uses: gradle/actions/setup-gradle@v4

      - name: Find the Gradle project
        id: find
        run: |
          GRADLEW=$(find . -maxdepth 3 -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found. Make sure the whole Android project is in this repository."
            exit 1
          fi
          echo "Found: $GRADLEW"
          echo "dir=$(dirname "$GRADLEW")" >> "$GITHUB_OUTPUT"

      - name: Build the debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          sed -i 's/\r$//' gradlew     # fixes Windows line endings
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-skip-ads-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
