name: Build Android APK

# - Every push to main builds a debug APK (download it from the run page, under "Artifacts").
# - Pushing a tag that starts with "v" (for example v1.0.0), or publishing a Release with such a tag,
#   also attaches the APK to that GitHub Release.
# - You can also start a build by hand: Actions -> Build Android APK -> Run workflow.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # needed to attach the APK to a Release

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Prepare the Android SDK (make it writable, accept licenses)
        # Uses the runner's own Java 17 for sdkmanager, because sdkmanager can fail on very new Java versions
        run: |
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          yes | JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Use the fixed debug key
        # Every build is signed with the same key, so a new APK installs over the old app
        # without uninstalling it first.
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"        # matches this project (gradle/gradle-daemon-jvm.properties asks for Java 25)

      - name: Set up Gradle (with cache, so later builds are faster)
        uses: gradle/actions/setup-gradle@v4

      - name: Find the Gradle project
        id: find
        run: |
          GRADLEW=$(find . -maxdepth 3 -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found. Make sure the whole Android project is in this repository."
            exit 1
          fi
          echo "Found: $GRADLEW"
          echo "dir=$(dirname "$GRADLEW")" >> "$GITHUB_OUTPUT"

      - name: Build the debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          sed -i 's/\r$//' gradlew     # fixes Windows line endings
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-skip-ads-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Attach the APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          cp "$APK" "AutoSkipAds-${GITHUB_REF_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "AutoSkipAds-${GITHUB_REF_NAME}.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "AutoSkipAds-${GITHUB_REF_NAME}.apk" \
              --title "Auto Skip Ads ${GITHUB_REF_NAME}" --generate-notes
          fi
